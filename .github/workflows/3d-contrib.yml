name: 3D Contribution Graph

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/3d-contrib.yml"
  workflow_dispatch:
  schedule:
    # 04:00 UTC = 09:30 AM IST
    # 09:00 UTC = 02:30 PM IST
    # 14:00 UTC = 07:30 PM IST
    # 17:00 UTC = 10:30 PM IST
    # 20:00 UTC = 01:30 AM IST (next day)
    # 6-minute stagger after the stats summary.
    - cron: "0 4 * * *"
    - cron: "0 9 * * *"
    - cron: "0 14 * * *"
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          USERNAME: adarsh0707-kumar

      - name: Commit and push the generated graph
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f profile-3d-contrib

          if git diff --cached --quiet; then
            echo "No changes to profile-3d-contrib"
          else
            git commit -m "chore: update 3D contribution graph"
            git push
          fi