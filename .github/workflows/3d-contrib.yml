name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day (midnight UTC)
  workflow_dispatch:        # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: adarsh0707-kumar

      - name: Commit and push the generated graph
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f profile-3d-contrib
          git commit -m "chore: update 3D contribution graph" || echo "Nothing to commit"
          git push
