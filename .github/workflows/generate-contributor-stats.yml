name: Generate Contributor Stats

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-contributor-stats.yml"
  workflow_dispatch:
  schedule:
    # 16:10 UTC = 21:40 IST, daily. Moved off 00:00 UTC, which is the most
    # contended slot on GitHub's scheduler and was queueing runs hours late.
    # First in the staggered card sequence - see generate-trophy.yml.
    - cron: "10 16 * * *"

permissions:
  contents: write

jobs:
  generate-contributor-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Generate notable contributions
        uses: lowlighter/metrics@latest
        with:
          # PAT with public_repo scope. The default GITHUB_TOKEN cannot read
          # contribution data across other people's repositories.
          # Same secret as generate-trophy.yml - one PAT serves both.
          token: ${{ secrets.PROFILE_TOKEN }}
          # Commit with the built-in token so the PAT is never used for writes.
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: main

          user: adarsh0707-kumar
          filename: profile/contributor-stats.svg
          base: ""
          template: classic
          config_timezone: Asia/Kolkata

          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
          # Without this the card renders empty: the plugin excludes repos you
          # own by default, and all contributions here are to own repositories.
          plugin_notable_self: yes

          output_action: commit
