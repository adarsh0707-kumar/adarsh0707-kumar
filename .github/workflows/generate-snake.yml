name: Generate Contribution Snake

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-snake.yml"
  workflow_dispatch:
  schedule:
    # 06:23 UTC = 11:53 IST. Moved off the :30 4 slot to avoid colliding with
    # the streak job (which runs at :30 4). Pushes to gh-pages, not main, so
    # it can't collide with the main-targeting jobs.
    - cron: "23 6 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish snake to gh-pages branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          build_branch: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}