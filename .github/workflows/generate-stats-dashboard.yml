name: Custom Stats Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dashboard
        env:
          # PAT with at least public_repo scope (repo scope for private contribs).
          # The default GITHUB_TOKEN cannot read the GraphQL contributionsCollection
          # for a user profile.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          USERNAME: adarsh0707-kumar
        run: node scripts/generate-stats-dashboard.js

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/stats-dashboard.svg
          git commit -m "chore: update stats dashboard" || echo "Nothing to commit"
          git push
