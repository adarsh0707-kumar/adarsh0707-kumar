name: Custom Stats Dashboard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-stats-dashboard.yml"
      - "scripts/generate-stats-dashboard.js"
  workflow_dispatch:
  schedule:
    # 17:07 UTC = 10:37 PM IST. Between streak's last run (16:00) and 3d-contrib
    # (17:43), so no two main-pushing jobs collide.
    - cron: "7 17 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dashboard
        env:
          # PAT with at least public_repo scope (repo scope for private contribs).
          # The default GITHUB_TOKEN cannot read the GraphQL contributionsCollection
          # for a user profile.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_USERNAME: adarsh0707-kumar
        run: node scripts/generate-stats-dashboard.js

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats-dashboard.svg

          if git diff --cached --quiet; then
            echo "No changes to profile/stats-dashboard.svg"
          else
            git commit -m "chore: update stats dashboard"
            git push
          fi