name: Generate README Stats Cards

# The public github-stats-extended instance caches the stats card for 24h and
# the top-langs card for 144h (6 days), and camo caches on top of that using
# the same headers. Neither is shortenable from the URL - cache_seconds is
# clamped to a 6h minimum. Generating the SVGs here and committing them means
# the README uses repo-relative paths, which bypasses camo entirely and
# refreshes on this schedule instead.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-stats.yml"
  workflow_dispatch:
  schedule:
    # 17:20 UTC = 22:50 IST, near the end of the local day. Offset from the
    # streak workflow so the two jobs do not collide on a push to main.
    - cron: "20 17 * * *"

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=adarsh0707-kumar&theme=merko&hide_border=false&include_all_commits=true&count_private=true
          path: profile/stats.svg
          # count_private only works with a PAT carrying repo scope. The
          # default GITHUB_TOKEN cannot read across your private repos.
          token: ${{ secrets.PROFILE_TOKEN }}
          # Do not commit a "Something went wrong" card if the API rate limits.
          fail_on_error: true

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=adarsh0707-kumar&theme=merko&hide_border=false&layout=compact
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_TOKEN }}
          fail_on_error: true

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/stats.svg profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes to the stats cards"
          else
            git commit -m "chore: update README stats cards"
            git push
          fi
