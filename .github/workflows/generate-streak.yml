name: Generate Streak Stats

# streak-stats.demolab.com returns accurate data but runs on a sleeping dyno,
# so a cold request takes ~16s. GitHub's camo image proxy times out at ~5s and
# serves a 504, which renders as a broken image. Fetching the card here and
# committing it means the README can reference a repo-relative path, which
# bypasses camo entirely.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-streak.yml"
  workflow_dispatch:
  schedule:
    # 04:30 UTC = 10:00 AM IST
    - cron: "30 4 * * *"

    # 08:40 UTC = 2:10 PM IST
    - cron: "40 8 * * *"

    # 13:30 UTC = 7:00 PM IST
    - cron: "30 13 * * *"

    # 16:00 UTC = 9:30 PM IST
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  generate-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Fetch streak card
        continue-on-error: true
        run: |
          url="https://streak-stats.demolab.com/?user=adarsh0707-kumar&theme=merko&hide_border=false"
          mkdir -p profile

          for attempt in 1 2 3; do
            echo "Attempt $attempt..."

            if curl -sSfL --max-time 10 "$url" -o streak.tmp; then
              if grep -q "Total Contributions" streak.tmp \
                && grep -q "<svg" streak.tmp \
                && [ "$(wc -c < streak.tmp)" -gt 2000 ]; then
                mv streak.tmp profile/streak.svg
                echo "Fetched a valid streak card ($(wc -c < profile/streak.svg) bytes)."
                exit 0
              fi
              echo "Invalid content returned, retrying..."
            else
              echo "Request failed, retrying..."
            fi

            sleep 5
          done

          echo "Service is currently down. Keeping existing streak.svg for this run."
          exit 0

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/streak.svg

          if git diff --cached --quiet; then
            echo "No changes to profile/streak.svg"
          else
            git commit -m "chore: update streak stats"
            git push
          fi