name: Generate Top Languages Card

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-top-langs.yml"
  workflow_dispatch:
  schedule:
    # 08:30 UTC = 14:00 IST (2:00 PM India)
    - cron: "30 8 * * *"

    # 16:00 UTC = 21:30 IST (9:30 PM India)
    - cron: "0 16 * * *"

permissions:
  contents: write

jobs:
  generate-top-langs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=adarsh0707-kumar&theme=merko&hide_border=false&layout=compact
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_TOKEN }}
          fail_on_error: true

      - name: Commit generated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes to profile/top-langs.svg"
          else
            git commit -m "chore: update top languages card"
            git push
          fi
