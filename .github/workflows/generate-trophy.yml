name: Generate GitHub Trophies

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-trophy.yml"
  workflow_dispatch:
  schedule:
    # 08:20 UTC = 1:50 PM IST  /  15:20 UTC = 8:50 PM IST
    # Staggered from the other card jobs; all push to main and must not overlap.
    # Order: contributor-stats (08:30/14:30), trophy (08:20/15:20),
    #        stats (08:30/15:30), streak (04:30/08:40/13:30/16:00).
    - cron: "20 8,15 * * *"

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub Trophies
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: adarsh0707-kumar
          file: profile/trophy.svg
          theme: darkhub
          # Must be a PAT. The default GITHUB_TOKEN is a repo-scoped
          # installation token and cannot resolve user().contributionsCollection
          # over GraphQL, which this action requires.
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit generated trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/trophy.svg

          if git diff --cached --quiet; then
            echo "No changes to profile/trophy.svg"
          else
            git commit -m "chore: update GitHub trophies"
            git push
          fi
