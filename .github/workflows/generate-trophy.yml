name: Generate GitHub Trophies

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-trophy.yml"
  workflow_dispatch:
  schedule:
    # 16:40 UTC = 22:10 IST, daily. Staggered from the other card jobs: they
    # all push to main, and two commits landing at the same minute means one
    # gets rejected non-fast-forward. Order is contributor-stats 21:40,
    # trophy 22:10, stats 22:50, streak 23:20 IST.
    - cron: "40 16 * * *"

permissions:
  contents: write

jobs:
  generate-trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub Trophies
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: adarsh0707-kumar
          file: profile/trophy.svg
          theme: darkhub
          # Must be a PAT. The default GITHUB_TOKEN is a repo-scoped
          # installation token and cannot resolve user().contributionsCollection
          # over GraphQL, which this action requires.
          token: ${{ secrets.PROFILE_TOKEN }}

      - name: Commit generated trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/trophy.svg

          if git diff --cached --quiet; then
            echo "No changes to profile/trophy.svg"
          else
            git commit -m "chore: update GitHub trophies"
            git push
          fi
