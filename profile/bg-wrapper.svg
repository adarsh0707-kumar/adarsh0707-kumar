<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"
     viewBox="0 0 1200 4000" preserveAspectRatio="none">
  <defs>
    <!-- Main vertical gradient matching header theme -->
    <linearGradient id="pageBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.00" stop-color="#020a05"/>
      <stop offset="0.05" stop-color="#041a0e"/>
      <stop offset="0.20" stop-color="#020a05"/>
      <stop offset="0.40" stop-color="#031408"/>
      <stop offset="0.60" stop-color="#020a05"/>
      <stop offset="0.80" stop-color="#041a0e"/>
      <stop offset="1.00" stop-color="#020a05"/>
    </linearGradient>

    <!-- Radial glow behind title area -->
    <radialGradient id="titleGlow" cx="50%" cy="8%" r="40%">
      <stop offset="0%" stop-color="#39ff7a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#39ff7a" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle radial glow lower down -->
    <radialGradient id="midGlow" cx="50%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#1c7a40" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1c7a40" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid pattern overlay -->
    <pattern id="bgGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#39ff7a" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <!-- Fine dot pattern -->
    <pattern id="bgDots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#39ff7a" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Base gradient background -->
  <rect width="1200" height="4000" fill="url(#pageBg)"/>

  <!-- Grid overlay -->
  <rect width="1200" height="4000" fill="url(#bgGrid)"/>

  <!-- Dot overlay -->
  <rect width="1200" height="4000" fill="url(#bgDots)"/>

  <!-- Radial glows -->
  <rect width="1200" height="4000" fill="url(#titleGlow)"/>
  <rect width="1200" height="4000" fill="url(#midGlow)"/>

  <!-- Top edge accent line -->
  <rect x="0" y="0" width="1200" height="2" fill="#39ff7a" fill-opacity="0.4"/>

  <!-- Bottom edge accent line -->
  <rect x="0" y="3998" width="1200" height="2" fill="#39ff7a" fill-opacity="0.2"/>
</svg>
