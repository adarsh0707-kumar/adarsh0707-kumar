<!-- animated verification strip -->
<rect x="45" y="400" width="1110" height="65" rx="18" fill="#161b22" stroke="#30363d"/>
<text x="70" y="438" fill="#7ee787" font-family="monospace" font-size="15">● VERIFIED LEARNING PORTFOLIO</text>
<text x="430" y="438" fill="#8b949e" font-family="Arial,sans-serif" font-size="14">2 documented programs · 2026</text>
<line x1="70" y1="452" x2="1130" y2="452" stroke="url(#scan)" stroke-width="1" stroke-dasharray="8 10"/>
