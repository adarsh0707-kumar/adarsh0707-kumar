<text x="735" y="163" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="20" font-weight="700">Data Science with Python</text>
<text x="735" y="190" fill="#8b949e" font-family="Arial,sans-serif" font-size="14">RCPL — ITS Engineering College</text>
