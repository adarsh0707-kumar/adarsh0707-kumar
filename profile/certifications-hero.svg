<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="cert-bg" cx="20%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#1a1140"/>
      <stop offset="55%" stop-color="#12123a"/>
      <stop offset="100%" stop-color="#0a0a24"/>
    </radialGradient>
    <linearGradient id="medal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="300" rx="18" fill="url(#cert-bg)"/>
  <rect x="1" y="1" width="898" height="298" rx="17" fill="none" stroke="#1e1b4b" stroke-width="1"/>

  <!-- Glow + medal -->
  <circle cx="140" cy="150" r="110" fill="url(#glow)"/>
  <circle cx="140" cy="140" r="46" fill="url(#medal)" stroke="#fcd34d" stroke-width="2"/>
  <circle cx="140" cy="140" r="38" fill="none" stroke="#fef3c7" stroke-opacity="0.6" stroke-width="1"/>
  <path d="M126 140 l9 9 19 -19" fill="none" stroke="#7c2d12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ribbon tails -->
  <path d="M118 175 l-10 34 22 -10 z" fill="url(#ribbon)"/>
  <path d="M162 175 l10 34 -22 -10 z" fill="#6366f1"/>

  <!-- Title block -->
  <text x="240" y="88" font-size="12" fill="#a5b4fc" font-weight="700" letter-spacing="4">ADARSH KUMAR · BACKEND &amp; SYSTEMS</text>
  <text x="240" y="150" font-size="46" fill="url(#title)" font-weight="900" letter-spacing="1">CERTIFICATIONS</text>
  <text x="240" y="182" font-size="16" fill="#93c5fd" font-weight="600" letter-spacing="2">&amp; PROFESSIONAL ACHIEVEMENTS</text>

  <line x1="240" y1="202" x2="560" y2="202" stroke="#3730a3" stroke-width="1"/>
  <text x="240" y="226" font-size="13" fill="#94a3b8">Verified learning across AI, digital skills and professional development.</text>

  <!-- Stat blocks -->
  <g>
    <text x="240" y="270" font-size="22" fill="#fff" font-weight="800">14+</text>
    <text x="240" y="284" font-size="9" fill="#818cf8" font-weight="600" letter-spacing="2">CERTIFICATES</text>

    <text x="360" y="270" font-size="22" fill="#fff" font-weight="800">5</text>
    <text x="360" y="284" font-size="9" fill="#818cf8" font-weight="600" letter-spacing="2">LEARNING TRACKS</text>

    <text x="510" y="270" font-size="22" fill="#fff" font-weight="800">40+</text>
    <text x="510" y="284" font-size="9" fill="#818cf8" font-weight="600" letter-spacing="2">PROJECTS</text>

    <text x="620" y="270" font-size="22" fill="#fff" font-weight="800">20K+</text>
    <text x="620" y="284" font-size="9" fill="#818cf8" font-weight="600" letter-spacing="2">COMMUNITY</text>
  </g>

  <!-- Certificate mockup (right) -->
  <g transform="translate(700,90) rotate(-6)">
    <rect x="0" y="0" width="150" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
    <rect x="0" y="0" width="150" height="105" rx="8" fill="none" stroke="#475569"/>
    <text x="75" y="26" font-size="9" fill="#94a3b8" font-weight="700" letter-spacing="2" text-anchor="middle">CERTIFICATE</text>
    <text x="75" y="40" font-size="8" fill="#64748b" letter-spacing="2" text-anchor="middle">OF ACHIEVEMENT</text>
    <line x1="20" y1="52" x2="130" y2="52" stroke="#1e293b"/>
    <path d="M20 78 q15 -12 30 0 t30 0 t30 0 t20 0" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="118" cy="88" r="10" fill="#fbbf24"/>
    <path d="M114 88 l3 3 6 -7" fill="none" stroke="#7c2d12" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Platform pills -->
  <g font-size="9" fill="#c7d2fe" font-weight="600">
    <rect x="240" y="290" width="62"  height="0" rx="0" fill="none"/>
  </g>
</svg>
