<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <rect width="1200" height="150" rx="24" fill="#0d1117"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="200" y="48" fill="#58a6ff" font-size="24" font-weight="700">NETWORKING</text>
    <text x="200" y="82" fill="#8b949e" font-size="17">Sockets · Protocols · TCP</text>
    <text x="600" y="48" fill="#7ee787" font-size="24" font-weight="700">SYSTEMS</text>
    <text x="600" y="82" fill="#8b949e" font-size="17">C++ · Databases · Runtime</text>
    <text x="1000" y="48" fill="#d2a8ff" font-size="24" font-weight="700">CLOUD</text>
    <text x="1000" y="82" fill="#8b949e" font-size="17">Docker · AWS · CI/CD</text>
    <circle cx="600" cy="125" r="5" fill="#58a6ff">
      <animate attributeName="cx" values="200;600;1000;600;200" dur="5s" repeatCount="indefinite"/>
