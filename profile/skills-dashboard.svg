<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs>
  <linearGradient id="border" x1="0" x2="1">
    <stop offset="0" stop-color="#58a6ff"/><stop offset=".5" stop-color="#7ee787"/><stop offset="1" stop-color="#d2a8ff"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="5" y="5" width="1190" height="510" rx="28" fill="#0d1117" stroke="#30363d"/>
<text x="55" y="50" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="28" font-weight="700">ANIMATED SKILL STACK</text>
<text x="55" y="76" fill="#8b949e" font-family="Arial,sans-serif" font-size="14">Tools I use to build from networking and systems to production cloud applications</text>

<!-- cards -->
<g font-family="Arial,sans-serif">
<g>
<rect x="45" y="105" width="350" height="155" rx="20" fill="#161b22" stroke="#30363d"/>
<text x="72" y="140" fill="#58a6ff" font-size="19" font-weight="700">⚙ LANGUAGES</text>
<text x="72" y="174" fill="#f0f6fc" font-size="18">C++ · C · Python</text>
<text x="72" y="204" fill="#8b949e" font-size="15">TypeScript · JavaScript</text>
<rect x="72" y="226" width="285" height="3" rx="2" fill="#30363d"/>
<rect x="72" y="226" width="90" height="3" rx="2" fill="#58a6ff">
<animate attributeName="width" values="30;285;30" dur="3.5s" repeatCount="indefinite"/>
</rect>
</g>

<g>
<rect x="425" y="105" width="350" height="155" rx="20" fill="#161b22" stroke="#30363d"/>
<text x="452" y="140" fill="#7ee787" font-size="19" font-weight="700">🧠 BACKEND &amp; DATA</text>
<text x="452" y="174" fill="#f0f6fc" font-size="18">Node.js · Express</text>
<text x="452" y="204" fill="#8b949e" font-size="15">PostgreSQL · Redis · Prisma</text>
<rect x="452" y="226" width="285" height="3" rx="2" fill="#30363d"/>
<rect x="452" y="226" width="90" height="3" rx="2" fill="#7ee787">
<animate attributeName="width" values="30;285;30" dur="3.5s" begin="1s" repeatCount="indefinite"/>
</rect>
</g>

<g>
<rect x="805" y="105" width="350" height="155" rx="20" fill="#161b22" stroke="#30363d"/>
<text x="832" y="140" fill="#d2a8ff" font-size="19" font-weight="700">🌐 FRONTEND</text>
<text x="832" y="174" fill="#f0f6fc" font-size="18">React · Next.js</text>
<text x="832" y="204" fill="#8b949e" font-size="15">Vite · Tailwind CSS</text>
<rect x="832" y="226" width="285" height="3" rx="2" fill="#30363d"/>
<rect x="832" y="226" width="90" height="3" rx="2" fill="#d2a8ff">
<animate attributeName="width" values="30;285;30" dur="3.5s" begin="2s" repeatCount="indefinite"/>
</rect>
</g>

<g>
<rect x="45" y="285" width="350" height="155" rx="20" fill="#161b22" stroke="#30363d"/>
<text x="72" y="320" fill="#ffa657" font-size="19" font-weight="700">☁ INFRASTRUCTURE</text>
<text x="72" y="354" fill="#f0f6fc" font-size="18">Docker · AWS</text>
<text x="72" y="384" fill="#8b949e" font-size="15">GitHub Actions · Linux</text>
<rect x="72" y="406" width="285" height="3" rx="2" fill="#30363d"/>
<rect x="72" y="406" width="90" height="3" rx="2" fill="#ffa657">
<animate attributeName="width" values="30;285;30" dur="3.5s" begin=".5s" repeatCount="indefinite"/>
</rect>
</g>

<g>
<rect x="425" y="285" width="350" height="155" rx="20" fill="#161b22" stroke="#30363d"/>
<text x="452" y="320" fill="#58a6ff" font-size="19" font-weight="700">🔌 SYSTEMS</text>
<text x="452" y="354" fill="#f0f6fc" font-size="18">TCP/IP · POSIX Sockets</text>
<text x="452" y="384" fill="#8b949e" font-size="15">CMake · Protocols · Parsers</text>
<rect x="452" y="406" width="285" height="3" rx="2" fill="#30363d"/>
<rect x="452" y="406" width="90" height="3" rx="2" fill="#58a6ff">
<animate attributeName="width" values="30;285;30" dur="3.5s" begin="1.5s" repeatCount="indefinite"/>
</rect>
</g>

<g>
<rect x="805" y="285" width="350" height="155" rx="20" fill="#161b22" stroke="#30363d"/>
<text x="832" y="320" fill="#7ee787" font-size="19" font-weight="700">🧪 WORKFLOW</text>
<text x="832" y="354" fill="#f0f6fc" font-size="18">Git · Testing · CI/CD</text>
<text x="832" y="384" fill="#8b949e" font-size="15">Debugging · Observability</text>
<rect x="832" y="406" width="285" height="3" rx="2" fill="#30363d"/>
<rect x="832" y="406" width="90" height="3" rx="2" fill="#7ee787">
<animate attributeName="width" values="30;285;30" dur="3.5s" begin="2.5s" repeatCount="indefinite"/>
</rect>
</g>
</g>

<circle cx="45" cy="480" r="5" fill="#58a6ff" filter="url(#glow)">
<animate attributeName="cx" values="45;1155;45" dur="5s" repeatCount="indefinite"/>
</circle>
<line x1="45" y1="480" x2="1155" y2="480" stroke="url(#border)" stroke-width="1" stroke-dasharray="7 9"/>
</svg>