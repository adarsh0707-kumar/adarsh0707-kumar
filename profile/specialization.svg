<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="550" viewBox="0 0 3840 550" preserveAspectRatio="xMidYMid meet">
  <rect width="3840" height="550" rx="32" fill="#0d1117"/>

  <!-- Title -->
  <text x="1920" y="150" text-anchor="middle" fill="#f0f6fc"
    font-family="Arial,Helvetica,sans-serif" font-size="88" font-weight="700">
    BUILDING FROM THE SOCKET LAYER UP
  </text>

  <!-- Subtitle -->
  <text x="1920" y="230" text-anchor="middle" fill="#8b949e"
    font-family="Arial,Helvetica,sans-serif" font-size="52">
    Systems • Networking • Databases • APIs • Cloud Infrastructure
  </text>

  <!-- Left animated dot (cyan) -->
  <circle cx="110" cy="175" r="18" fill="#06b6d4">
    <animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Right animated dot (purple) -->
  <circle cx="3730" cy="175" r="18" fill="#7c3aed">
    <animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
