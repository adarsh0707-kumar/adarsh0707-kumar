<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" viewBox="0 0 3840 200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="specBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020a05"/>
      <stop offset="0.5" stop-color="#04200f"/>
      <stop offset="1" stop-color="#020a05"/>
    </linearGradient>
    <linearGradient id="specBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff7a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39ff7a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#39ff7a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="specTitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9ffe8"/>
      <stop offset="0.5" stop-color="#eafff2"/>
      <stop offset="1" stop-color="#d9ffe8"/>
    </linearGradient>
    <pattern id="specGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#39ff7a" stroke-opacity="0.045" stroke-width="2"/>
    </pattern>
    <pattern id="specDots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#39ff7a" fill-opacity="0.08"/>
    </pattern>
    <filter id="specGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="3840" height="200" rx="24" fill="url(#specBg)"/>
  <rect width="3840" height="200" rx="24" fill="url(#specGrid)"/>
  <rect width="3840" height="200" rx="24" fill="url(#specDots)"/>

  <rect x="40" y="6" width="3760" height="2" fill="url(#specBeam)"/>
  <rect x="40" y="192" width="3760" height="2" fill="url(#specBeam)"/>

  <g stroke="#39ff7a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7" filter="url(#specGlow)">
    <path d="M60 70V50H90"/>
    <path d="M60 130V150H90"/>
  </g>

  <g stroke="#39ff7a" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7" filter="url(#specGlow)">
    <path d="M3780 70V50H3750"/>
    <path d="M3780 130V150H3750"/>
  </g>

  <circle cx="110" cy="100" r="6" fill="#06b6d4">
    <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="3730" cy="100" r="6" fill="#7ee787">
    <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <text x="1920" y="88" text-anchor="middle"
        font-family="'SFMono-Regular', Consolas, 'Courier New', monospace"
        font-size="54" font-weight="800" letter-spacing="8"
        fill="url(#specTitle)" filter="url(#specGlow)">
    BUILDING FROM THE SOCKET LAYER UP
  </text>

  <text x="1920" y="140" text-anchor="middle"
        font-family="'SFMono-Regular', Consolas, 'Courier New', monospace"
        font-size="26" letter-spacing="4"
        fill="#8fa89b">
    Systems · Networking · Databases · APIs · Cloud Infrastructure
  </text>
</svg>
