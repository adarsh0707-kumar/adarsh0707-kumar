    <circle cx="34" cy="9" r="3" fill="#10b981"/>
    <text x="16" y="52" font-size="11" fill="#93c5fd" font-family="monospace">void accept_loop(int fd) {</text>
    <text x="16" y="70" font-size="11" fill="#a7f3d0" font-family="monospace">  while (1) {</text>
    <text x="16" y="88" font-size="11" fill="#c7d2fe" font-family="monospace">    int c = accept(fd, ...);</text>
    <text x="16" y="106" font-size="11" fill="#fde68a" font-family="monospace">    thread(handle, c);</text>
    <text x="16" y="124" font-size="11" fill="#a7f3d0" font-family="monospace">  }</text>
    <text x="16" y="142" font-size="11" fill="#93c5fd" font-family="monospace">}</text>
    <rect x="-10" y="160" width="280" height="8" rx="3" fill="#1e293b"/>
  </g>

