<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="320" viewBox="0 0 3840 320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="typBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#020a05"/>
      <stop offset="0.5" stop-color="#04200f"/>
      <stop offset="1" stop-color="#020a05"/>
    </linearGradient>
    <linearGradient id="typBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff7a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39ff7a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#39ff7a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="typGrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#39ff7a" stroke-opacity="0.045" stroke-width="2"/>
    </pattern>
    <pattern id="typDots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#39ff7a" fill-opacity="0.08"/>
    </pattern>
    <filter id="typGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="3840" height="320" rx="24" fill="url(#typBg)"/>
  <rect width="3840" height="320" rx="24" fill="url(#typGrid)"/>
  <rect width="3840" height="320" rx="24" fill="url(#typDots)"/>

  <rect x="40" y="8" width="3760" height="3" fill="url(#typBeam)"/>
  <rect x="40" y="309" width="3760" height="3" fill="url(#typBeam)"/>

  <g stroke="#39ff7a" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.75" filter="url(#typGlow)">
    <path d="M80 110V80H130"/>
    <path d="M80 210V240H130"/>
    <path d="M3760 110V80H3710"/>
    <path d="M3760 210V240H3710"/>
  </g>

  <circle cx="150" cy="80" r="8" fill="#39ff7a">
    <animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="3690" cy="240" r="8" fill="#7ee787">
    <animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <text x="1920" y="186" text-anchor="middle"
        font-family="'SFMono-Regular', Consolas, 'Courier New', monospace"
        font-size="94" font-weight="700" letter-spacing="8"
        fill="#39ff7a" filter="url(#typGlow)">
    Backend &amp; Systems Engineer
    <animate attributeName="opacity"
      values="1;1;0;0"
      keyTimes="0;0.30;0.33;1"
      dur="9s"
      repeatCount="indefinite"/>
  </text>

  <text x="1920" y="186" text-anchor="middle"
        font-family="'SFMono-Regular', Consolas, 'Courier New', monospace"
        font-size="94" font-weight="700" letter-spacing="8"
        fill="#7ee787" filter="url(#typGlow)">
    Building from the socket layer up
    <animate attributeName="opacity"
      values="0;0;1;1;0;0"
      keyTimes="0;0.30;0.33;0.63;0.66;1"
      dur="9s"
      repeatCount="indefinite"/>
  </text>

  <text x="1920" y="186" text-anchor="middle"
        font-family="'SFMono-Regular', Consolas, 'Courier New', monospace"
        font-size="94" font-weight="700" letter-spacing="8"
        fill="#d9ffe8" filter="url(#typGlow)">
    C++ · Python · Node.js · PostgreSQL · AWS
    <animate attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.63;0.66;1"
      dur="9s"
      repeatCount="indefinite"/>
  </text>
</svg>
